evaluation_method: "Trajectory-wise Weighted Importance Sampling"
behavior_policy:
  smoothing_method: "Laplace"
  alpha: 0.05
target_policy:
  mode: "soft"
  recommended_prob: 0.99
  off_policy_prob: 0.01
wis:
  weight_clip: 500.0
  gamma: 0.99
bootstrap:
  n_bootstraps: 500
  resample_level: "patient"
  confidence_level: 0.95
  random_state: 42
sensitivity:
  alphas: [0.01, 0.05, 0.10, 0.20]
  weight_clips: [100.0, 250.0, 500.0, 1000.0]
  soft_probs: [0.95, 0.98, 0.99]
